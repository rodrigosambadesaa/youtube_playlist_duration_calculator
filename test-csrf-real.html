<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test CSRF Real</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
    </style>
</head>

<body>
    <h1>Test CSRF Completo</h1>
    <div id="results"></div>
    <button onclick="testFullFlow()">Probar Flujo Completo</button>

    <script>
        async function testFullFlow() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="info">Iniciando test...</div>';

            try {
                // Paso 1: Obtener token CSRF
                console.log('Paso 1: Obteniendo token CSRF...');
                const tokenResponse = await fetch('api.php?action=csrf-token', {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                if (!tokenResponse.ok) {
                    throw new Error(`Error HTTP en token: ${tokenResponse.status}`);
                }

                const tokenData = await tokenResponse.json();
                console.log('Token data:', tokenData);

                if (!tokenData.success || !tokenData.csrf_token) {
                    throw new Error('No se pudo obtener token CSRF válido');
                }

                const csrfToken = tokenData.csrf_token;
                resultsDiv.innerHTML += `<div class="success">✅ Token CSRF obtenido: ${csrfToken.substring(0, 16)}...</div>`;

                // Paso 2: Probar con API real
                console.log('Paso 2: Probando API con token...');
                const apiResponse = await fetch('api.php?action=playlist-duration', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        playlistId: 'PLrAXtmRdnEQy8VgTl62wdkmMLKWMvOYGF',
                        csrf_token: csrfToken
                    })
                });

                console.log('API Response status:', apiResponse.status);
                const apiData = await apiResponse.json();
                console.log('API Data:', apiData);

                if (apiResponse.ok) {
                    resultsDiv.innerHTML += `<div class="success">✅ API funcionando: ${apiData.data?.title || 'Datos obtenidos'}</div>`;
                } else {
                    resultsDiv.innerHTML += `<div class="error">❌ Error en API (${apiResponse.status}): ${apiData.error || 'Error desconocido'}</div>`;
                }

            } catch (error) {
                console.error('Error en test:', error);
                resultsDiv.innerHTML += `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        // Auto-ejecutar
        document.addEventListener('DOMContentLoaded', testFullFlow);
    </script>
</body>

</html>
